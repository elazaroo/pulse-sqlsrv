name: tests

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-22.04

    services:
      sqlsrv:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Password123!
        ports:
          - 1433:1433

    strategy:
      fail-fast: false
      matrix:
        php: [8.2, 8.3, 8.4]
        laravel: [11, 12]
        stability: [prefer-stable]

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - SQL Server 2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, sqlsrv, pdo_sqlsrv
          ini-values: error_reporting=E_ALL
          tools: composer:v2
          coverage: none

      - name: Create database
        run: |
          php -r '
            $dsn = "sqlsrv:Server=127.0.0.1,1433;TrustServerCertificate=true";
            for ($attempt = 1; $attempt <= 30; $attempt++) {
                try {
                    (new PDO($dsn, "sa", "Password123!"))->exec("CREATE DATABASE pulse");
                    exit(0);
                } catch (PDOException $e) {
                    echo "Waiting for SQL Server... ({$attempt})\n";
                    sleep(2);
                }
            }
            fwrite(STDERR, "SQL Server did not become available.\n");
            exit(1);
          '

      - name: Require Laravel ${{ matrix.laravel }}
        run: composer require "illuminate/support:^${{ matrix.laravel }}.0" --no-interaction --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress --${{ matrix.stability }}

      - name: Execute tests
        run: vendor/bin/pest
        env:
          DB_CONNECTION: sqlsrv
          DB_HOST: 127.0.0.1
          DB_PORT: 1433
          DB_DATABASE: pulse
          DB_USERNAME: sa
          DB_PASSWORD: Password123!
